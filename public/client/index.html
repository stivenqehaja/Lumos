<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casting Selection - Client Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <nav class="bg-white shadow-md sticky top-0 z-40">
        <div class="container mx-auto px-4 py-4">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-xl font-bold" id="companyName">Loading...</h1>
                    <p class="text-sm text-gray-600" id="commercialDescription"></p>
                </div>
                <div class="flex gap-4 items-center">
                    <button onclick="toggleCastingGroup()" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600">
                        Casting Group (<span id="castingCount">0</span>)
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Filters -->
    <div class="bg-white shadow-md mb-4">
        <div class="container mx-auto px-4 py-4">
            <div class="grid md:grid-cols-6 gap-4">
                <div>
                    <label class="block text-xs text-gray-600 mb-1">Search Name</label>
                    <input type="text" id="searchName" class="w-full px-2 py-1 border rounded text-sm" placeholder="Name...">
                </div>
                <div>
                    <label class="block text-xs text-gray-600 mb-1">Gender</label>
                    <select id="filterGender" class="w-full px-2 py-1 border rounded text-sm">
                        <option value="">All</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-gray-600 mb-1">Min Age</label>
                    <input type="number" id="minAge" class="w-full px-2 py-1 border rounded text-sm" placeholder="18">
                </div>
                <div>
                    <label class="block text-xs text-gray-600 mb-1">Max Age</label>
                    <input type="number" id="maxAge" class="w-full px-2 py-1 border rounded text-sm" placeholder="65">
                </div>
                <div>
                    <label class="block text-xs text-gray-600 mb-1">Hair Color</label>
                    <input type="text" id="hairColor" class="w-full px-2 py-1 border rounded text-sm" placeholder="Blonde">
                </div>
                <div>
                    <label class="block text-xs text-gray-600 mb-1">Eye Color</label>
                    <input type="text" id="eyeColor" class="w-full px-2 py-1 border rounded text-sm" placeholder="Blue">
                </div>
            </div>
            <button onclick="applyFilters()" class="mt-3 bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600 text-sm">Apply Filters</button>
        </div>
    </div>

    <div class="container mx-auto px-4 py-8">
        <!-- Performers Grid -->
        <div id="performersGrid" class="grid md:grid-cols-3 lg:grid-cols-4 gap-6">
            <p class="text-center text-gray-500">Loading performers...</p>
        </div>
    </div>

    <!-- Casting Group Sidebar -->
    <div id="castingSidebar" class="hidden fixed top-0 right-0 w-96 h-full bg-white shadow-xl z-50 overflow-y-auto">
        <div class="p-6">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold">Casting Group</h2>
                <button onclick="toggleCastingGroup()" class="text-gray-500 hover:text-gray-700">✕</button>
            </div>
            <div id="castingGroupList" class="space-y-4"></div>
            <button onclick="finalizeCasting()" class="w-full mt-6 bg-green-500 text-white py-3 rounded-lg hover:bg-green-600">
                Finalize Selection
            </button>
        </div>
    </div>

    <!-- Image Viewer Modal -->
    <div id="imageModal" class="hidden fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50" onclick="closeImageModal()">
        <div class="max-w-4xl max-h-[90vh]">
            <img id="modalImage" src="" class="max-w-full max-h-[90vh] object-contain">
        </div>
    </div>

    <script src="/js/client/main.js"></script>
</body>
</html>
