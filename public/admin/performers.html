<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Performers - Casting Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <nav class="bg-white shadow-md">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex gap-4 items-center">
                <a href="/admin" class="text-blue-500 hover:text-blue-700">← Back</a>
                <h1 class="text-xl font-bold">Manage Performers</h1>
            </div>
            <button onclick="logout()" class="text-red-500 hover:text-red-700">Logout</button>
        </div>
    </nav>

    <div class="container mx-auto px-4 py-8">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold">Performers</h2>
            <button onclick="showAddForm()" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600">
                + Add Performer
            </button>
        </div>

        <!-- Add/Edit Form Modal -->
        <div id="performerModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
            <div class="bg-white p-8 rounded-lg max-w-2xl w-full max-h-[90vh] overflow-y-auto">
                <h3 id="modalTitle" class="text-xl font-bold mb-4">Add Performer</h3>
                <form id="performerForm">
                    <input type="hidden" id="performerId">
                    <div class="grid md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-gray-700 mb-2">First Name</label>
                            <input type="text" id="firstName" class="w-full px-3 py-2 border rounded-lg" required>
                        </div>
                        <div>
                            <label class="block text-gray-700 mb-2">Last Name</label>
                            <input type="text" id="lastName" class="w-full px-3 py-2 border rounded-lg" required>
                        </div>
                        <div>
                            <label class="block text-gray-700 mb-2">Birthday</label>
                            <input type="date" id="birthday" class="w-full px-3 py-2 border rounded-lg" required>
                        </div>
                        <div>
                            <label class="block text-gray-700 mb-2">Email</label>
                            <input type="email" id="email" class="w-full px-3 py-2 border rounded-lg" required>
                        </div>
                        <div>
                            <label class="block text-gray-700 mb-2">Phone</label>
                            <input type="tel" id="phone" class="w-full px-3 py-2 border rounded-lg" required>
                        </div>
                        <div>
                            <label class="block text-gray-700 mb-2">Gender</label>
                            <select id="gender" class="w-full px-3 py-2 border rounded-lg" required>
                                <option value="">Select...</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-gray-700 mb-2">Height (cm)</label>
                            <input type="number" id="height" class="w-full px-3 py-2 border rounded-lg" required>
                        </div>
                        <div>
                            <label class="block text-gray-700 mb-2">Hair Color</label>
                            <input type="text" id="hairColor" class="w-full px-3 py-2 border rounded-lg" required>
                        </div>
                        <div>
                            <label class="block text-gray-700 mb-2">Eye Color</label>
                            <input type="text" id="eyeColor" class="w-full px-3 py-2 border rounded-lg" required>
                        </div>
                        <div>
                            <label class="block text-gray-700 mb-2">Skin Tone</label>
                            <input type="text" id="skinTone" class="w-full px-3 py-2 border rounded-lg" required>
                        </div>
                        <div>
                            <label class="block text-gray-700 mb-2">Face Shape</label>
                            <input type="text" id="faceShape" class="w-full px-3 py-2 border rounded-lg">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-gray-700 mb-2">Distinctive Marks</label>
                            <textarea id="distinctiveMarks" class="w-full px-3 py-2 border rounded-lg" rows="2"></textarea>
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-gray-700 mb-2">Image URLs (one per line, max 9)</label>
                            <textarea id="images" class="w-full px-3 py-2 border rounded-lg" rows="4" placeholder="https://example.com/image1.jpg&#10;https://example.com/image2.jpg"></textarea>
                        </div>
                    </div>
                    <div class="flex gap-4 mt-6">
                        <button type="submit" class="flex-1 bg-blue-500 text-white py-2 rounded-lg hover:bg-blue-600">Save</button>
                        <button type="button" onclick="closeModal()" class="flex-1 bg-gray-300 text-gray-700 py-2 rounded-lg hover:bg-gray-400">Cancel</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Delete Confirmation Modal -->
        <div id="deleteModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
            <div class="bg-white p-8 rounded-lg max-w-md w-full">
                <h3 class="text-xl font-bold mb-4">Delete Performer</h3>
                <p id="deleteStep1" class="mb-4">Are you sure you want to delete this performer?</p>
                <p id="deleteStep2" class="mb-4 hidden">Type <strong>YES</strong> to confirm deletion:</p>
                <input type="text" id="deleteConfirm" class="w-full px-3 py-2 border rounded-lg mb-4 hidden">
                <div class="flex gap-4">
                    <button id="deleteBtn" onclick="confirmDelete()" class="flex-1 bg-red-500 text-white py-2 rounded-lg hover:bg-red-600">Delete</button>
                    <button onclick="closeDeleteModal()" class="flex-1 bg-gray-300 text-gray-700 py-2 rounded-lg hover:bg-gray-400">Cancel</button>
                </div>
            </div>
        </div>

        <!-- Performers List -->
        <div id="performersList" class="grid gap-4">
            <p class="text-center text-gray-500">Loading performers...</p>
        </div>
    </div>

    <script src="/js/admin/performers.js"></script>
</body>
</html>
