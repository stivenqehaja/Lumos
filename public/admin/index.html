<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Casting Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <nav class="bg-white shadow-md">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">Casting Platform Admin</h1>
            <div class="flex gap-4 items-center">
                <span id="adminUsername" class="text-gray-600"></span>
                <button onclick="logout()" class="text-red-500 hover:text-red-700">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container mx-auto px-4 py-8">
        <div class="grid md:grid-cols-2 gap-6 mb-8">
            <!-- Generate Client Link Card -->
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-xl font-bold mb-4">Generate Client Link</h2>
                <form id="generateLinkForm">
                    <div class="mb-4">
                        <label class="block text-gray-700 mb-2">Company Name</label>
                        <input type="text" id="companyName" class="w-full px-3 py-2 border rounded-lg" required>
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 mb-2">Commercial Description</label>
                        <textarea id="commercialDescription" class="w-full px-3 py-2 border rounded-lg" rows="4" required></textarea>
                    </div>
                    <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded-lg hover:bg-blue-600">
                        Generate Link
                    </button>
                </form>
                <div id="generatedLink" class="mt-4 hidden">
                    <p class="text-sm text-gray-600 mb-2">Client URL (valid for 24h):</p>
                    <div class="flex gap-2">
                        <input type="text" id="clientUrl" class="flex-1 px-3 py-2 border rounded-lg bg-gray-50" readonly>
                        <button onclick="copyLink()" class="bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600">
                            Copy
                        </button>
                    </div>
                </div>
            </div>

            <!-- Quick Stats Card -->
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-xl font-bold mb-4">Quick Actions</h2>
                <div class="space-y-3">
                    <a href="/admin/performers" class="block w-full bg-purple-500 text-white text-center py-3 rounded-lg hover:bg-purple-600">
                        Manage Performers
                    </a>
                    <a href="/admin/casting-orders" class="block w-full bg-indigo-500 text-white text-center py-3 rounded-lg hover:bg-indigo-600">
                        View Casting Orders
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Check authentication
        const token = localStorage.getItem('adminToken');
        if (!token) {
            window.location.href = '/admin/login';
        }

        const adminUser = JSON.parse(localStorage.getItem('adminUser') || '{}');
        document.getElementById('adminUsername').textContent = adminUser.username || '';

        function logout() {
            localStorage.removeItem('adminToken');
            localStorage.removeItem('adminUser');
            window.location.href = '/admin/login';
        }

        function copyLink() {
            const urlInput = document.getElementById('clientUrl');
            urlInput.select();
            document.execCommand('copy');
            alert('Link copied to clipboard!');
        }

        document.getElementById('generateLinkForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const companyName = document.getElementById('companyName').value;
            const commercialDescription = document.getElementById('commercialDescription').value;

            try {
                const response = await fetch('/api/client/generate-link', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ companyName, commercialDescription })
                });

                const data = await response.json();

                if (response.ok) {
                    document.getElementById('clientUrl').value = data.url;
                    document.getElementById('generatedLink').classList.remove('hidden');
                } else {
                    alert(data.error || 'Failed to generate link');
                }
            } catch (error) {
                alert('Network error. Please try again.');
            }
        });
    </script>
</body>
</html>
