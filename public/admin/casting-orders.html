<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casting Orders - Casting Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <nav class="bg-white shadow-md">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex gap-4 items-center">
                <a href="/admin" class="text-blue-500 hover:text-blue-700">← Back</a>
                <h1 class="text-xl font-bold">Casting Orders</h1>
            </div>
            <button onclick="logout()" class="text-red-500 hover:text-red-700">Logout</button>
        </div>
    </nav>

    <div class="container mx-auto px-4 py-8">
        <!-- Orders List -->
        <div id="ordersList" class="space-y-4">
            <p class="text-center text-gray-500">Loading casting orders...</p>
        </div>

        <!-- Email Modal -->
        <div id="emailModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
            <div class="bg-white p-8 rounded-lg max-w-2xl w-full max-h-[90vh] overflow-y-auto">
                <h3 class="text-xl font-bold mb-4">Generate & Send Emails</h3>
                <div id="emailContent">
                    <p class="text-gray-600 mb-4">Select performers to send emails:</p>
                    <div id="performersList" class="space-y-4"></div>
                </div>
                <button onclick="closeEmailModal()" class="mt-4 w-full bg-gray-300 text-gray-700 py-2 rounded-lg hover:bg-gray-400">Close</button>
            </div>
        </div>

        <!-- Individual Email Modal -->
        <div id="individualEmailModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
            <div class="bg-white p-8 rounded-lg max-w-2xl w-full max-h-[90vh] overflow-y-auto">
                <h3 class="text-xl font-bold mb-4">Email Preview</h3>
                <div class="mb-4">
                    <p class="text-sm text-gray-600 mb-2">To: <span id="emailRecipient" class="font-semibold"></span></p>
                    <div class="mb-4">
                        <label class="block text-gray-700 mb-2">Email Content</label>
                        <textarea id="emailTextarea" class="w-full px-3 py-2 border rounded-lg" rows="10"></textarea>
                    </div>
                    <div class="flex gap-4">
                        <button onclick="sendIndividualEmail()" class="flex-1 bg-green-500 text-white py-2 rounded-lg hover:bg-green-600">Send Email</button>
                        <button onclick="closeIndividualEmailModal()" class="flex-1 bg-gray-300 text-gray-700 py-2 rounded-lg hover:bg-gray-400">Cancel</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/admin/casting-orders.js"></script>
</body>
</html>
